[workspace]
resolver = "3"
members = ["crates/tidewatch-core", "crates/tidewatch"]

[workspace.package]
version = "0.1.52"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tidewatch-core = { path = "crates/tidewatch-core" }
kelp-core = { git = "https://github.com/Hobo-Ware/kelp", rev = "3d846f091bb777ff0427482b27b7291e4ea299b6" }
kelp-ui = { git = "https://github.com/Hobo-Ware/kelp", rev = "3d846f091bb777ff0427482b27b7291e4ea299b6" }
stdusk-core = { git = "https://github.com/Hobo-Ware/stdusk", rev = "bf197c174fa70bafdf2282071d07dd04584bdbbf" }
stdusk-egui = { git = "https://github.com/Hobo-Ware/stdusk", rev = "bf197c174fa70bafdf2282071d07dd04584bdbbf" }
anyhow = "1.0.104"
base64 = "0.22.1"
eframe = { version = "0.35.0", features = ["glow", "__screenshot"] }
egui = "0.35.0"
emojis = "0.9.1"
global-hotkey = "0.8.0"
gix = { version = "0.88.0", default-features = false, features = ["sha1"] }
httparse = "1.10.1"
jiff = "0.2.38"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = { version = "0.45.1", default-features = false }
roxmltree = "0.20.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.10.9"
hmac = "0.12.1"
shell-words = "1.1.1"
tempfile = "3.27.0"
toml = "1.1.8"
uuid = { version = "1.28.0", default-features = false, features = ["v4"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
egui_extras = { version = "0.35.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny" # justified local #[allow]s only: main's edition-2024 set_var + terminal's killpg FFI

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# pedantic allow-list, justified per-lint for a GUI + parser crate:
cast_possible_truncation = "allow" # deliberate: pct as u8, cols as u16 for PtySize
cast_sign_loss = "allow"           # grid line i32 -> usize after .max(0)
cast_precision_loss = "allow"      # u8 pct -> f32 for the progress bar
cast_possible_wrap = "allow"       # usize offsets -> i32 for scroll deltas
module_name_repetitions = "allow"  # OscScanner in osc, TabState in terminal read fine
missing_errors_doc = "allow"       # no public library API to document
missing_panics_doc = "allow"       # startup-invariant expects are documented inline
doc_markdown = "allow"             # terminal jargon (OSC, ANSI, pty, cwd, Tabby) isn't code
enum_glob_use = "allow"            # `use NamedColor::*` in a 16-arm match reads fine
float_cmp = "allow"                # exact != 0.0 / defaults comparisons are intentional
similar_names = "allow"            # bel/st, cw/ch, rows/cols are the domain vocabulary
too_many_lines = "allow"           # the eframe render loop is legitimately long
too_many_arguments = "allow"       # render_grid threads ui + rect + term + metrics per pane
large_stack_arrays = "allow"       # fires on libtest's generated test list past ~2000 tests, no source line
