[package]
name = "tidewatch"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "tidewatch"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
eframe.workspace = true
egui.workspace = true
egui_commonmark.workspace = true
egui_extras.workspace = true
global-hotkey.workspace = true
image.workspace = true
jiff.workspace = true
kelp-core.workspace = true
kelp-ui.workspace = true
resvg.workspace = true
rfd = "0.17.2"
stdusk-core.workspace = true
serde.workspace = true
serde_json.workspace = true
shell-words.workspace = true
stdusk-egui.workspace = true
tidewatch-core.workspace = true
winit = "0.30.13"

[target.'cfg(target_os = "macos")'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSEvent", "NSGraphicsContext", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSError", "NSGeometry", "NSString"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "pwr_mgt"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }
tray-icon = "0.24.1"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
