<svg xmlns="http://www.w3.org/2000/svg" class="mo" viewBox="0 0 400 440" role="img" aria-label="Tidewatch mascot: Lost page"><style>
.mo :is(.blink,.dart,.bob,.breathe,.rise,.cursor,.bub,.peekeye,.peekopen,.tab,.slip,.sweat,.rock,.reach){transform-box:fill-box}
.mo .blink{transform-origin:center;animation:blink 5.5s infinite}
.mo .dart{animation:dart 4.6s ease-in-out infinite}
.mo .bob{animation:bob 3.2s ease-in-out infinite}
.mo .breathe{transform-origin:50% 90%;animation:breathe 4.4s ease-in-out infinite}
.mo .rise{animation:rise 7s ease-in-out infinite}
.mo .cursor{animation:cursor 1.1s steps(1) infinite}
.mo .bub{animation:bub 3.6s ease-in infinite;opacity:0}
.mo .b2{animation-delay:1.2s}.mo .b3{animation-delay:2.4s}
.mo .peekeye{animation:peekshut 8s infinite}.mo .peekopen{animation:peekopen 8s infinite;opacity:0}
.mo .tab{transform-origin:center;animation:juggle 2.4s ease-in-out infinite}
.mo .t2{animation-delay:.8s}.mo .t3{animation-delay:1.6s}
.mo .slip{transform-origin:20% 80%;animation:slip 5s ease-in-out infinite}
.mo .sweat{animation:sweat 5s ease-in infinite;opacity:0}
.mo .rock{transform-origin:50% 100%;animation:rock 2.8s ease-in-out infinite}
.mo .reach{animation:reach 2.8s ease-in-out infinite}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}96%{transform:scaleY(1)}}
@keyframes dart{0%,35%{transform:translate(0,0)}42%,70%{transform:translate(2.5px,-1px)}78%,100%{transform:translate(-2px,1px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.015,1.035)}}
@keyframes rise{0%{transform:translateY(46px)}22%,70%{transform:translateY(0)}92%,100%{transform:translateY(46px)}}
@keyframes cursor{0%{opacity:1}50%{opacity:0}}
@keyframes bub{0%{opacity:0;transform:translateY(16px)}25%{opacity:.8}100%{opacity:0;transform:translateY(-26px)}}
@keyframes peekshut{0%,62%,78%,100%{opacity:1}64%,76%{opacity:0}}
@keyframes peekopen{0%,62%,78%,100%{opacity:0}64%,76%{opacity:1}}
@keyframes juggle{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(6deg)}}
@keyframes slip{0%,20%{transform:translate(0,0) rotate(0)}55%,80%{transform:translate(-58px,64px) rotate(-28deg)}100%{transform:translate(0,0) rotate(0)}}
@keyframes sweat{0%,45%{opacity:0;transform:translateY(-6px)}55%{opacity:1}80%{opacity:0;transform:translateY(22px)}100%{opacity:0}}
@keyframes rock{0%,100%{transform:rotate(-7deg) translateX(-4px)}50%{transform:rotate(7deg) translateX(4px)}}
@keyframes reach{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@media (prefers-reduced-motion: reduce){.mo *{animation:none !important}}
</style><defs>
